{% load static %}

<!-- Page header / breadcrumbs -->
<section class="relative overflow-hidden pt-32 pb-10 sm:pt-36">
  <div class="pointer-events-none absolute inset-0 grid-bg" aria-hidden="true"></div>
  <div class="pointer-events-none absolute -top-24 right-0 h-72 w-72 rounded-full bg-neon-violet/20 blur-[110px]" aria-hidden="true"></div>
  <div class="container-x relative">
    <nav class="mb-6 font-mono text-xs text-slate-500 sm:text-sm" aria-label="Breadcrumb">
      <ol class="flex flex-wrap items-center gap-2">
        <li><a href="{% url 'home' %}" class="hover:text-neon-cyan">Home</a></li>
        <li>/</li>
        <li><a href="{% url 'home' %}#portfolio" class="hover:text-neon-cyan">Projects</a></li>
        <li>/</li>
        <li class="text-slate-300">{{ item.title }}</li>
      </ol>
    </nav>
    <span class="chip !text-neon-cyan">Project</span>
    <h1 class="mt-4 max-w-3xl font-display text-3xl font-bold tracking-tight text-white sm:text-5xl">{{ item.title }}</h1>
    <p class="mt-3 font-mono text-sm text-slate-400">{{ item.category }}</p>
  </div>
</section>

<!-- Details -->
<section class="pb-20 sm:pb-24">
  <div class="container-x">
    <div class="grid gap-8 lg:grid-cols-[1.6fr_1fr]">

      <!-- Main -->
      <div class="min-w-0 space-y-6">
        <div class="relative flex aspect-[16/8] items-end overflow-hidden rounded-2xl border border-white/10 bg-gradient-to-br from-cyan-500/25 via-ink-800 to-violet-600/25">
          <!-- Fallback (shown when there is no image) -->
          <div class="absolute inset-0 grid-bg opacity-80"></div>
          <svg class="absolute inset-x-0 bottom-0 h-3/4 w-full text-neon-cyan/50" viewBox="0 0 400 120" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="0,100 50,78 100,86 150,48 200,62 250,30 300,40 350,14 400,8"/>
          </svg>
          <span class="relative m-5 font-mono text-xs text-slate-300 sm:text-sm">{{ item.category }}</span>
          <!-- Image from static/images/projects/<slug>.jpg|png|webp -->
          <img data-img-base="{% static 'images/projects/' %}{{ item.slug }}" alt="{{ item.title }}"
               class="absolute inset-0 h-full w-full bg-ink-800 object-cover">
        </div>

        <div class="glass rounded-2xl p-6 sm:p-8">
          <h2 class="font-display text-2xl font-bold text-white">About this project</h2>
          <p class="mt-4 whitespace-pre-line leading-relaxed text-slate-400">{{ item.description }}</p>
        </div>
      </div>

      <!-- Sidebar -->
      <aside class="min-w-0 space-y-6">
        <div class="glass rounded-2xl p-6">
          <h3 class="mb-4 border-b border-white/10 pb-3 font-display text-lg font-semibold text-white">Project information</h3>
          <dl class="space-y-4 text-sm">
            <div><dt class="font-mono text-[11px] uppercase tracking-wider text-slate-500">Title</dt><dd class="mt-1 font-medium text-white">{{ item.title }}</dd></div>
            <div><dt class="font-mono text-[11px] uppercase tracking-wider text-slate-500">Category</dt><dd class="mt-1 font-medium text-white">{{ item.category }}</dd></div>
          </dl>
        </div>
        <a href="{% url 'home' %}#portfolio" class="btn-ghost w-full">← Back to portfolio</a>
      </aside>
    </div>
  </div>
</section>
