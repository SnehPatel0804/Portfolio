{% load static %}

<header id="site-header" class="fixed inset-x-0 top-0 z-50 transition-all duration-300">
  <div class="container-x">
    <nav class="mt-3 flex h-14 items-center justify-between rounded-2xl border border-white/10 bg-ink-950/70 px-3 pl-4 backdrop-blur-xl sm:px-4" aria-label="Main navigation">

      <!-- Brand -->
      <a href="{% url 'home' %}" class="flex min-w-0 items-center gap-3">
        <img src="{% static 'images/sneh.png' %}" alt=""
             class="h-8 w-8 shrink-0 rounded-full object-cover ring-2 ring-neon-cyan/60" />
        <span class="truncate font-display text-base font-semibold text-white sm:text-lg">
          {{ profile.name|default:"Sneh" }}
        </span>
      </a>

      <!-- Desktop links -->
      <ul class="hidden items-center gap-1 md:flex">
        <li><a href="{% url 'home' %}#hero"      data-nav="hero"      class="nav-link rounded-lg px-4 py-2 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-white">Home</a></li>
        <li><a href="{% url 'home' %}#about"     data-nav="about"     class="nav-link rounded-lg px-4 py-2 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-white">About</a></li>

      </ul>

      <!-- Desktop socials -->
      <div class="hidden items-center gap-2 md:flex">
        <a href="https://www.linkedin.com/in/sneh-patel-346831215/" target="_blank" rel="noopener" aria-label="LinkedIn"

        <svg id="icon-open" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg id="icon-close" class="hidden h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18"/></svg>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="mt-2 hidden rounded-2xl border border-white/10 bg-ink-950/95 p-3 backdrop-blur-xl md:hidden">
      <ul class="space-y-1">
        <li><a href="{% url 'home' %}#hero"      class="block rounded-lg px-4 py-3 font-medium text-slate-200 hover:bg-white/5">Home</a></li>
        <li><a href="{% url 'home' %}#about"     class="block rounded-lg px-4 py-3 font-medium text-slate-200 hover:bg-white/5">About</a></li>
        <li><a href="{% url 'home' %}#resume"    class="block rounded-lg px-4 py-3 font-medium text-slate-200 hover:bg-white/5">Resume</a></li>
        <li><a href="{% url 'home' %}#portfolio" class="block rounded-lg px-4 py-3 font-medium text-slate-200 hover:bg-white/5">Portfolio</a></li>
        <li><a href="{% url 'home' %}#contact"   class="block rounded-lg px-4 py-3 font-medium text-slate-200 hover:bg-white/5">Contact</a></li>
      </ul>
      <div class="mt-2 flex gap-2 border-t border-white/10 px-2 pt-3">
        <a href="https://www.linkedin.com/in/sneh-patel-346831215/" target="_blank" rel="noopener" class="btn-ghost flex-1 !py-2">LinkedIn</a>
        <a href="https://github.com/SnehPatel0804" target="_blank" rel="noopener" class="btn-ghost flex-1 !py-2">GitHub</a>
      </div>
    </div>
  </div>
</header>
